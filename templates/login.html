{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Palmistry</title>
    <link rel="stylesheet" href="{% static 'login.css' %}">
   

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <!-- Left Side -->
    <div class="left">

        <h1>AI Palmistry</h1>

        <p>
            Unlock your future through AI-powered palm reading.
        </p>

        <img src="{% static 'images/palm.png' %}" alt="Palm">

    </div>

    <!-- Right Side -->
    <div class="right">

        <div class="login-box">

            <h2>Welcome Back 👋</h2>

            <p>Login to continue</p>

            <form method="POST">

                {% csrf_token %}

                <input type="email"
                       name="email"
                       placeholder="Email Address"
                       required>

                <input type="password"
                       name="password"
                       placeholder="Password"
                       required>

                <button type="submit">
                    Login
                </button>

            </form>

            <div class="links">

                <a href="#">Forgot Password?</a>

                <p>
                    Don't have an account?
                    <a href="#">Register</a>
                </p>

            </div>

        </div>

    </div>

</div>

</body>
</html>
